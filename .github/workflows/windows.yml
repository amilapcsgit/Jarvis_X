name: Windows build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Jarvis.csproj -c Release
      - run: node --check web/jarvis.js
      - run: python -m py_compile blender_mcp_offline.py fallback_model.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed' }
          ./Get-ReleaseAssets.ps1
          dotnet restore Jarvis.csproj -r win-x64
          if ($LASTEXITCODE) { throw 'Restore failed' }
          ./Build-Nullsoft.ps1 -OutputDirectory publish-release
          $hash = (Get-FileHash publish-release/Jarvis_X_Setup.exe).Hash.ToLowerInvariant()
          "$hash  Jarvis_X_Setup.exe" | Set-Content -Encoding ascii publish-release/Jarvis_X_Setup.exe.sha256
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --draft --generate-notes publish-release/Jarvis_X_Setup.exe publish-release/Jarvis_X_Setup.exe.sha256 Install-Missing-Dependencies.bat
          if ($LASTEXITCODE) { throw 'Release upload failed' }
